<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CREOVERSE STOCK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  background: linear-gradient(135deg, #0a1628 0%, #1a2942 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-container {
  background: #ffffff;
  border-radius: 20px;
  padding: 35px 28px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
  position: relative;
  overflow: hidden;
}

.login-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
}

.logo-section {
  text-align: center;
  margin-bottom: 25px;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border-radius: 16px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  color: #0a1628;
  font-size: 28px;
  box-shadow: 0 8px 25px rgba(251, 191, 36, 0.5);
  margin-bottom: 12px;
}

.logo-section h1 {
  font-size: 22px;
  font-weight: 800;
  color: #0a1628;
}

/* Main tabs (Login / Signup) */
.tabs {
  display: flex;
  background: #f1f5f9;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  color: #64748b;
  cursor: pointer;
  border-radius: 9px;
  transition: 0.3s;
}

.tab-btn.active {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #0a1628;
  box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
}

/* Social login buttons */
.social-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}

.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 12px;
  border: 2px solid #e2e8f0;
  background: #ffffff;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  transition: 0.3s;
}

.social-btn:hover {
  border-color: #fbbf24;
  background: #fffbeb;
}

.social-btn.google { color: #ea4335; }
.social-btn.phone { color: #10b981; }

.social-btn img, .social-btn i {
  font-size: 18px;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e2e8f0;
}

/* Form */
.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: #334155;
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: 0.3s;
  background: #ffffff;
  color: #1a1f2e;
}

.form-group input:focus {
  border-color: #fbbf24;
  box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
}

.submit-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* Message */
.message {
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 15px;
  display: none;
  align-items: center;
  gap: 8px;
  line-height: 1.5;
}

.message.show { display: flex; }
.message.error {
  background: rgba(239, 68, 68, 0.1);
  color: #dc2626;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.message.success {
  background: rgba(16, 185, 129, 0.1);
  color: #059669;
  border: 1px solid rgba(16, 185, 129, 0.3);
}
.message.info {
  background: rgba(59, 130, 246, 0.1);
  color: #2563eb;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.hidden { display: none !important; }

/* Phone verification screen */
#phoneVerifyScreen {
  display: none;
}

#phoneVerifyScreen.active {
  display: block;
}

.otp-inputs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 15px 0;
}

.otp-inputs input {
  width: 44px;
  height: 52px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  outline: none;
  transition: 0.3s;
}

.otp-inputs input:focus {
  border-color: #fbbf24;
  box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
}

/* reCAPTCHA container (hidden) */
#recaptcha-container {
  margin: 15px 0;
}

/* Back link */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #64748b;
  font-size: 12.5px;
  text-decoration: none;
  margin-top: 12px;
  cursor: pointer;
  background: none;
  border: none;
  transition: 0.2s;
  padding: 0;
}

.back-link:hover { color: #f59e0b; }

.footer-text {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 16px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="login-container">

  <div class="logo-section">
    <div class="logo-icon"><i class="fas fa-shopping-bag"></i></div>
    <h1>CREOVERSE STOCK</h1>
  </div>

  <!-- ========== MAIN SCREEN ========== -->
  <div id="mainScreen">
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="messageBox" class="message"></div>

    <!-- Social Login Buttons -->
    <div class="social-btns">
      <button class="social-btn google" onclick="handleGoogleLogin()">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <button class="social-btn phone" onclick="showPhoneLogin()">
        <i class="fas fa-phone"></i> Continue with Phone
      </button>
    </div>

    <div class="divider">OR</div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password (min 6 characters)</label>
        <input type="password" id="signupPassword" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="submit-btn" id="signupBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>
  </div>

  <!-- ========== PHONE VERIFY SCREEN ========== -->
  <div id="phoneVerifyScreen">
    <div id="phoneMessageBox" class="message"></div>

    <!-- Phone Number Input (step 1) -->
    <div id="phoneStep1">
      <div class="form-group">
        <label>Phone Number (with country code)</label>
        <input type="tel" id="phoneNumber" placeholder="+8801XXXXXXXXX" required>
      </div>
      <button type="button" class="submit-btn" id="sendOtpBtn" onclick="sendOtp()">
        <i class="fas fa-paper-plane"></i> Send OTP
      </button>
    </div>

    <!-- OTP Input (step 2) -->
    <div id="phoneStep2" class="hidden">
      <p style="text-align:center;font-size:13px;color:#64748b;margin-bottom:10px;">
        Enter the 6-digit OTP sent to <br><strong id="phoneDisplay" style="color:#0a1628;"></strong>
      </p>
      <div class="form-group">
        <input type="text" id="otpInput" placeholder="123456" maxlength="6" inputmode="numeric" style="text-align:center;font-size:20px;letter-spacing:8px;font-weight:700;">
      </div>
      <button type="button" class="submit-btn" id="verifyOtpBtn" onclick="verifyOtp()">
        <i class="fas fa-check"></i> Verify & Login
      </button>
    </div>

    <button type="button" class="back-link" onclick="backToMain()">
      <i class="fas fa-arrow-left"></i> Back to Login
    </button>
  </div>

  <!-- reCAPTCHA (invisible) -->
  <div id="recaptcha-container"></div>

  <div class="footer-text">
    <p>© 2026 CREOVERSE STOCK</p>
  </div>
</div>

<!-- ============ FIREBASE SDK ============ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzWwbk-Dh1Kzzp9CvNyqC28ToCWXw41Qs",
    authDomain: "creoverse-stock.firebaseapp.com",
    projectId: "creoverse-stock",
    storageBucket: "creoverse-stock.firebasestorage.app",
    messagingSenderId: "128072247505",
    appId: "1:128072247505:web:47e58c3a140f4e858bbdf0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Make functions global
  window.switchTab = switchTab;
  window.handleLogin = handleLogin;
  window.handleSignup = handleSignup;
  window.handleGoogleLogin = handleGoogleLogin;
  window.showPhoneLogin = showPhoneLogin;
  window.sendOtp = sendOtp;
  window.verifyOtp = verifyOtp;
  window.backToMain = backToMain;

  let confirmationResult = null;
  let recaptchaVerifier = null;

  // ---------- TAB SWITCHING ----------
  function switchTab(tab) {
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    hideMessage();

    if (tab === 'login') {
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
    } else {
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    }
  }

  // ---------- MESSAGE HELPERS ----------
  function showMessage(text, type, target) {
    const boxId = target === 'phone' ? 'phoneMessageBox' : 'messageBox';
    const box = document.getElementById(boxId);
    box.className = 'message show ' + type;
    const icon = type === 'error' ? 'exclamation-circle' : (type === 'success' ? 'check-circle' : 'info-circle');
    box.innerHTML = `<i class="fas fa-${icon}"></i> ${text}`;
  }

  function hideMessage(target) {
    const boxId = target === 'phone' ? 'phoneMessageBox' : 'messageBox';
    document.getElementById(boxId).className = 'message';
  }

  // ---------- EMAIL/PASSWORD LOGIN ----------
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
    hideMessage();

    try {
      await signInWithEmailAndPassword(auth, email, password);
      showMessage('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      showMessage(translateError(err.code), 'error');
    }
  }

  // ---------- SIGNUP ----------
  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
    hideMessage();

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      showMessage('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      showMessage(translateError(err.code), 'error');
    }
  }

  // ---------- GOOGLE LOGIN ----------
  async function handleGoogleLogin() {
    hideMessage();
    showMessage('Opening Google...', 'info');
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    try {
      await signInWithPopup(auth, provider);
      showMessage('Google login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      if (err.code === 'auth/popup-closed-by-user') {
        hideMessage();
        return;
      }
      showMessage(translateError(err.code), 'error');
    }
  }

  // ---------- PHONE LOGIN ----------
  function showPhoneLogin() {
    document.getElementById('mainScreen').classList.add('hidden');
    document.getElementById('phoneVerifyScreen').classList.add('active');
    document.getElementById('phoneStep1').classList.remove('hidden');
    document.getElementById('phoneStep2').classList.add('hidden');
    hideMessage('phone');

    // Setup recaptcha if not already
    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        size: 'invisible',
        callback: () => {}
      });
    }
  }

  function backToMain() {
    document.getElementById('mainScreen').classList.remove('hidden');
    document.getElementById('phoneVerifyScreen').classList.remove('active');
    hideMessage('phone');
  }

  async function sendOtp() {
    const phone = document.getElementById('phoneNumber').value.trim();
    if (!phone) {
      showMessage('Phone number din', 'error', 'phone');
      return;
    }
    if (!phone.startsWith('+')) {
      showMessage('Country code soho din (jemon: +8801XXXXXXXXX)', 'error', 'phone');
      return;
    }

    const btn = document.getElementById('sendOtpBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    hideMessage('phone');

    try {
      confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
      document.getElementById('phoneDisplay').textContent = phone;
      document.getElementById('phoneStep1').classList.add('hidden');
      document.getElementById('phoneStep2').classList.remove('hidden');
      showMessage('OTP pathানো hoyeche. SMS check korun.', 'success', 'phone');
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
      showMessage(translateError(err.code), 'error', 'phone');
    }
  }

  async function verifyOtp() {
    const otp = document.getElementById('otpInput').value.trim();
    if (otp.length !== 6) {
      showMessage('6 digit OTP din', 'error', 'phone');
      return;
    }

    const btn = document.getElementById('verifyOtpBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    hideMessage('phone');

    try {
      await confirmationResult.confirm(otp);
      showMessage('Phone verified! Redirecting...', 'success', 'phone');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> Verify & Login';
      showMessage('OTP bhul ba expire hoyeche. Abar try korun.', 'error', 'phone');
    }
  }

  // ---------- ERROR TRANSLATOR ----------
  function translateError(code) {
    const errors = {
      'auth/email-already-in-use': 'Ei email diye already account ache.',
      'auth/invalid-email': 'Email thik nai.',
      'auth/weak-password': 'Password durbal (min 6 character).',
      'auth/user-not-found': 'Account nai. Signup korun.',
      'auth/wrong-password': 'Password bhul.',
      'auth/invalid-credential': 'Email ba password bhul.',
      'auth/too-many-requests': 'Onek bar try. Ektu wait korun.',
      'auth/network-request-failed': 'Internet problem.',
      'auth/popup-blocked': 'Popup blocked. Browser settings check korun.',
      'auth/account-exists-with-different-credential': 'Ei email onno method diye already registered.',
      'auth/invalid-phone-number': 'Phone number thik nai.',
      'auth/missing-phone-number': 'Phone number din.',
      'auth/quota-exceeded': 'SMS quota sesh. Pore try korun.',
      'auth/captcha-check-failed': 'reCAPTCHA fail. Page reload korun.',
      'auth/invalid-verification-code': 'OTP bhul.',
      'auth/code-expired': 'OTP expire hoyeche.',
    };
    return errors[code] || 'Kichu ekta bhul hoyeche. Abar try korun.';
  }

  // ---------- AUTO REDIRECT IF LOGGED IN ----------
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = 'dashboard.html';
    }
  });
</script>

</body>
</html>
